# Уровни доверия к источникам (ТЗ, «Требования к источникам»).
#
# Порядок: сначала уровень по типу источника (by_source_type), затем уточнение по домену.
# Домен сравнивается по окончанию: «nature.com» подходит и для www.nature.com, и для link.nature.com;
# «.gov» — для любых доменов, которые на него оканчиваются. Первое совпадение из high → medium → low.
# Неизвестный домен — уровень по типу источника. Сюда попадают и официальные сайты компаний-разработчиков:
# ТЗ относит их к доверенным источникам, поэтому их материалы (тип news/report) получают средний уровень,
# а пресс-релизы (тип press_release) — низкий: ТЗ разрешает их только как первичный индикатор.

by_source_type:
  paper: high          # научная статья (журнал, конференция)
  patent: high         # патентные базы
  gov: high            # госорганы, регуляторы, международные организации
  preprint: medium     # arXiv и т.п. — без рецензии
  report: medium       # аналитические отчёты
  news: medium         # СМИ
  blog: low            # ТЗ: блоги, соцсети, пресс-релизы — только первичный индикатор
  social: low
  press_release: low
  other: low

