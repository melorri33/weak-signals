# Правила отсева до модели: убирают только очевидное и всегда объясняют причину по-русски.
# Всё неочевидное решает модель (src/model). Поле признака без данных (None) правило не срабатывает.
#
# Пороги откалиброваны на обучающей выборке (100 сигналов организаторов + 253 не-сигнала,
# публикации OpenAlex по точной фразе, медиа — Hacker News). Главное требование — не отсекать
# ни одного сигнала из датасета организаторов: проверяется тестом tests/filters.

mature:
  # Максимум у сигналов датасета — 4 857 работ; порог 5 000 отсекает 52 из 172 зрелых и 0 сигналов.
  total_pubs_min: 5000
  # Есть стандарт — технология уже сформировалась (признак появится, когда term_stats начнёт его заполнять).
  has_standard: true

hype:
  # Медиа пишут о технологии больше, чем учёные. Оба условия сразу: 0 сигналов, 4 из 253 не-сигналов.
  # Мягче нельзя: у некоторых сигналов тоже бывает до 66 упоминаний и до 1.15 упоминания на работу.
  news_total_min: 100
  news_to_science_ratio_min: 0.5

noise:
  # ТЗ: соцсети, блоги, агрегаторы, пресс-релизы не могут быть единственным основанием.
  # Если среди документов кандидата нет ни одного со средним или высоким доверием — исключаем.
  require_trusted_source: true
