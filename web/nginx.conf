# Один адрес для жюри: интерфейс и API с того же хоста — CORS не нужен.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/search → http://api:8000/search. Адрес резолвится при запросе, а не при старте:
    # nginx поднимется, даже если контейнер api ещё не готов, и отдаст 502 вместо падения.
    resolver 127.0.0.11 valid=10s ipv6=off;
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Файлы сборки с хэшем в имени кэшируются навсегда.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Маршруты приложения (/run/…, /run/…/signal/…) отдаёт index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
